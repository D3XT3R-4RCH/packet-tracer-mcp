[project]
name = "packet-tracer-mcp"
version = "0.1.0"
description = "Servidor MCP (Model Context Protocol) para automatización y telemetría de Cisco Packet Tracer vía IPC TCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
packet-tracer-mcp = "packet_tracer_mcp.server:main"
packet-tracer-agent = "packet_tracer_mcp.bridge.pt_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
